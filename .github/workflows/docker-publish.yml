name: Publish Auth Service image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: auth-service-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/shiguang-lab/auth-service

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Tag '$REF_NAME' carries no version; expected vX.Y.Z." >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$version"
            echo "$IMAGE_NAME:$REF_NAME"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA::12}"
            echo "$IMAGE_NAME:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Shiguang Auth Service
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,scope=auth-service,mode=max
